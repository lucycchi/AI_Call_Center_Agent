# Fly.io settings for the Meridian chat agent (R77): one always-on machine running one worker, with the scheduling
# and operations databases on an attached volume at /data. Keys live only in Fly.io secrets (see the README's
# rollback runbook), never in this file. Deploy with scripts/deploy.sh.
# The app name below is a placeholder: change it to the name chosen at `scripts/fly apps create`.

app = "meridian-agent"
primary_region = "dfw"  # Dallas, nearest to Austin

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/scheduling.sqlite"
  OPS_DATABASE_PATH = "/data/operations.sqlite"
  PYTHONUNBUFFERED = "1"
  # Reviewer-only (D50): public visitors can view the site, but only reviewer-link sessions can chat.
  PER_VISITOR_DAILY_USD = "0"

[mounts]
  source = "meridian_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
